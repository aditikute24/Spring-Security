spring.application.name=Demo-Spring-Security
spring.datasource.url= jdbc:postgresql://localhost:5432/spring
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.example.user_managment_system=INFO

logging.file.name=log/application.log

spring.security.user.name=user
spring.security.user.password=admin

jwt.secret=secretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecret