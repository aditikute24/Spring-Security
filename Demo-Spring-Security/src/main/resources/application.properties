# ==========================================
# Application Configuration
# ==========================================
spring.application.name=Demo-Spring-Security


# ==========================================
# PostgreSQL Database Configuration
# ==========================================
# Database URL: localhost, port 5432, database name: spring
spring.datasource.url=jdbc:postgresql://localhost:5432/spring

# PostgreSQL username
spring.datasource.username=postgres

# PostgreSQL password
spring.datasource.password=root


# ==========================================
# JPA and Hibernate Configuration
# ==========================================
# Automatically updates database tables based on entity changes
spring.jpa.hibernate.ddl-auto=update

# Formats SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Displays SQL queries in the console
spring.jpa.show-sql=true

# Specifies the PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# Logging Configuration
# ==========================================
# Sets the default logging level
logging.level.root=INFO

# Sets the logging level for your application package
logging.level.com.example.demo_spring_security=INFO

# Writes application logs to this file
logging.file.name=log/application.log


# ==========================================
# Default Spring Security User
# ==========================================
# Creates a default in-memory user when using Spring Boot's
# default UserDetailsService and no custom user configuration overrides it.
# These properties are not your JWT credentials.
# If you use CustomUserDetailsService, configure users in your database instead.
# spring.security.user.name=admin
# spring.security.user.password=change-this-password


# ==========================================
# JWT Configuration
# ==========================================
# Secret key used to sign and validate JWT tokens.
# Use a long, securely generated secret and keep it private.
# For an HMAC-SHA key, use at least 32 bytes for HS256.
# Do not commit your real secret key to Git.
jwt.secret=REPLACE_WITH_YOUR_LONG_RANDOM_SECRET_KEY
